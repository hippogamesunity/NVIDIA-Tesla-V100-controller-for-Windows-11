name: Build Windows console application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build TeslaV100Controller.sln -c Release
      - run: dotnet run --project tests/TeslaV100Controller.Tests -c Release
      - name: Publish self-contained executable
        run: >-
          dotnet publish src/TeslaV100Controller -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: TeslaV100Controller-win-x64
          path: artifacts/win-x64/TeslaV100Controller.exe
